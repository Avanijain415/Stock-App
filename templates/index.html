<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Stock & Ledger Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-main: #f4f6f8; --card-bg: #ffffff; --text-color: #212529;
            --primary: #198754; --primary-hover: #146c43; --border-color: #dee2e6;
        }
        [data-theme="dark"] {
            --bg-main: #121212; --card-bg: #1e1e1e; --text-color: #e0e0e0;
            --primary: #20c997; --primary-hover: #1aa179; --border-color: #333333;
        }
        body { background-color: var(--bg-main); color: var(--text-color); font-family: 'Segoe UI', Tahoma, sans-serif; }
        .card { background-color: var(--card-bg); border-color: var(--border-color); }
        .status-badge { font-size: 0.75rem; padding: 4px 8px; border-radius: 12px; }
    </style>
</head>
<body>

<div class="container py-4" id="loginSection">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card shadow p-4 mt-5">
                <h4 class="text-center mb-3">📦 Inventory Login</h4>
                <div class="mb-3">
                    <label>Username</label>
                    <input type="text" id="username" class="form-control" placeholder="master or worker1">
                </div>
                <div class="mb-3">
                    <label>Password</label>
                    <input type="password" id="password" class="form-control" placeholder="admin123 or worker123">
                </div>
                <button class="btn btn-success w-100" onclick="handleLogin()">Login</button>
            </div>
        </div>
    </div>
</div>

<div class="container-fluid px-4 py-3 d-none" id="appSection">
    <!-- Navbar -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Warehouse Inventory & Ledger Hub</h2>
        <div>
            <span class="badge bg-primary me-2" id="roleBadge"></span>
            <button class="btn btn-outline-secondary btn-sm me-2" onclick="toggleTheme()"><i class="bi bi-moon"></i></button>
            <button class="btn btn-outline-danger btn-sm" onclick="handleLogout()">Logout</button>
        </div>
    </div>

    <!-- Analytics (Master only) -->
    <div class="row mb-4 master-only">
        <div class="col-md-6">
            <div class="card p-3 shadow-sm"><canvas id="stockDonut" style="max-height:220px;"></canvas></div>
        </div>
        <div class="col-md-6">
            <div class="card p-3 shadow-sm"><canvas id="lowStockBar" style="max-height:220px;"></canvas></div>
        </div>
    </div>

    <!-- Action Bar -->
    <div class="card p-3 mb-4 shadow-sm">
        <div class="row g-2 align-items-center">
            <div class="col-md-4">
                <input type="text" id="searchInput" class="form-control" placeholder="🔍 Search description, HSN, Brand..." oninput="filterData()">
            </div>
            <div class="col-md-3">
                <select id="brandFilter" class="form-select" onchange="filterData()">
                    <option value="">All Brands</option>
                </select>
            </div>
            <div class="col-md-5 text-end master-only">
                <button class="btn btn-outline-success" onclick="exportCSV()"><i class="bi bi-download"></i> Export Master CSV</button>
            </div>
        </div>
    </div>

    <!-- Product Table -->
    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Description & HSN</th>
                        <th>Brand</th>
                        <th>Price/MRP</th>
                        <th>Actual Stock</th>
                        <th>Status</th>
                        <th>Adjust Stock</th>
                        <th>Audit Ledger</th>
                    </tr>
                </thead>
                <tbody id="productTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- ITEM LEDGER MODAL -->
<div class="modal fade" id="ledgerModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content card">
            <div class="modal-header">
                <h5 class="modal-title" id="ledgerTitle">Product Ledger History</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="productQuickDetails" class="alert alert-info mb-3"></div>
                <h6>📅 Transaction Timeline</h6>
                <div class="table-responsive">
                    <table class="table table-sm table-striped">
                        <thead>
                            <tr>
                                <th>Timestamp</th>
                                <th>User</th>
                                <th>Action</th>
                                <th>Qty</th>
                                <th>Prev Stock</th>
                                <th>New Stock</th>
                                <th>Details</th>
                            </tr>
                        </thead>
                        <tbody id="ledgerTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
let currentRole = '';
let allProducts = [];
let ledgerModalObj;

document.addEventListener('DOMContentLoaded', () => {
    ledgerModalObj = new bootstrap.Modal(document.getElementById('ledgerModal'));
});

async function handleLogin() {
    const u = document.getElementById('username').value;
    const p = document.getElementById('password').value;
    const res = await fetch('/api/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({username: u, password: p})
    });
    if(res.ok) {
        const data = await res.json();
        currentRole = data.role;
        document.getElementById('loginSection').classList.add('d-none');
        document.getElementById('appSection').classList.remove('d-none');
        document.getElementById('roleBadge').innerText = `${data.username} (${data.role.toUpperCase()})`;
        
        if(currentRole !== 'master') {
            document.querySelectorAll('.master-only').forEach(el => el.classList.add('d-none'));
        }
        fetchProducts();
    } else {
        alert('Invalid Login Credentials');
    }
}

async function fetchProducts() {
    const res = await fetch('/api/products');
    allProducts = await res.json();
    populateBrandFilter();
    renderTable(allProducts);
    if(currentRole === 'master') renderCharts();
}

function renderTable(items) {
    const tbody = document.getElementById('productTableBody');
    tbody.innerHTML = items.map(p => `
        <tr>
            <td>${p.id}</td>
            <td>
                <strong>${p.description}</strong><br>
                <small class="text-muted">HSN: ${p.hsn_code || 'N/A'} | Expiry: ${p.expiry_date || 'N/A'}</small>
            </td>
            <td>${p.brand}</td>
            <td>₹${p.price} <br><small class="text-muted">MRP: ₹${p.mrp}</small></td>
            <td><h5 class="mb-0 text-${p.actual_stock > 10 ? 'success' : (p.actual_stock > 0 ? 'warning' : 'danger')}">${p.actual_stock}</h5></td>
            <td><span class="badge ${p.status === 'Completed' ? 'bg-success' : 'bg-warning'} status-badge">${p.status}</span></td>
            <td>
                <button class="btn btn-sm btn-outline-danger me-1" onclick="adjust(${p.id}, -1)">- Issue</button>
                <button class="btn btn-sm btn-outline-success" onclick="adjust(${p.id}, 1)">+ Receive</button>
            </td>
            <td>
                <button class="btn btn-sm btn-info text-white" onclick="viewLedger(${p.id})">📖 View History</button>
            </td>
        </tr>
    `).join('');
}

async function adjust(id, change) {
    const qty = prompt(`Enter quantity to ${change > 0 ? 'Receive (+)' : 'Issue (-)'}:`, "1");
    if(!qty || isNaN(qty) || qty <= 0) return;
    
    const res = await fetch('/api/products/adjust', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({id: id, change: parseInt(qty) * change})
    });
    if(res.ok) fetchProducts();
}

async function viewLedger(id) {
    const res = await fetch(`/api/products/${id}/ledger`);
    const data = await res.json();
    const p = data.product;
    
    document.getElementById('ledgerTitle').innerText = `Ledger: ${p.description}`;
    document.getElementById('productQuickDetails').innerHTML = `
        <strong>Brand:</strong> ${p.brand} | <strong>Current Stock:</strong> ${p.actual_stock} | 
        <strong>Opening Stock:</strong> ${p.opening_stock} | <strong>Damage:</strong> ${p.damage}
    `;
    
    const tbody = document.getElementById('ledgerTableBody');
    if(data.ledger.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted">No historical transactions logged yet.</td></tr>`;
    } else {
        tbody.innerHTML = data.ledger.map(l => `
            <tr>
                <td>${l.timestamp}</td>
                <td><span class="badge bg-secondary">${l.username}</span></td>
                <td><span class="badge bg-${l.action === 'RECEIVE' ? 'success' : 'danger'}">${l.action}</span></td>
                <td>${l.quantity}</td>
                <td>${l.prev_stock}</td>
                <td><strong>${l.new_stock}</strong></td>
                <td><small>${l.details || ''}</small></td>
            </tr>
        `).join('');
    }
    ledgerModalObj.show();
}

function filterData() {
    const query = document.getElementById('searchInput').value.toLowerCase();
    const brand = document.getElementById('brandFilter').value;
    const filtered = allProducts.filter(p => {
        const matchesSearch = p.description.toLowerCase().includes(query) || (p.hsn_code && p.hsn_code.toLowerCase().includes(query)) || p.brand.toLowerCase().includes(query);
        const matchesBrand = brand === '' || p.brand === brand;
        return matchesSearch && matchesBrand;
    });
    renderTable(filtered);
}

function populateBrandFilter() {
    const brands = [...new Set(allProducts.map(p => p.brand))].filter(Boolean);
    const select = document.getElementById('brandFilter');
    select.innerHTML = '<option value="">All Brands</option>' + brands.map(b => `<option value="${b}">${b}</option>`).join('');
}

function exportCSV() {
    window.location.href = '/api/export/csv';
}

function toggleTheme() {
    const current = document.body.getAttribute('data-theme');
    document.body.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
}

function handleLogout() {
    fetch('/api/logout', {method: 'POST'}).then(() => location.reload());
}
</script>
</body>
</html>
